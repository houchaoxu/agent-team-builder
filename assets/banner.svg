<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
  <title id="title">Agent Team Builder</title>
  <desc id="desc">Talk. Build. Remember. Persistent teams, on demand.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="0">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="320" rx="24" fill="url(#background)"/>
  <circle cx="1060" cy="25" r="190" fill="#1e40af" opacity=".12"/>
  <circle cx="60" cy="320" r="130" fill="#14b8a6" opacity=".08"/>
  <rect x="50" y="44" width="5" height="150" rx="2.5" fill="url(#accent)"/>
  <text x="82" y="77" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#5eead4">TALK. BUILD. REMEMBER.</text>
  <text x="78" y="147" font-family="Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-2" fill="#f8fafc">Agent Team Builder</text>
  <text x="82" y="188" font-family="Arial, sans-serif" font-size="23" fill="#cbd5e1">Persistent teams. On demand. One conversation away.</text>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="82" y="237" width="188" height="40" rx="20" fill="#134e4a"/>
    <text x="176" y="263" text-anchor="middle" fill="#99f6e4">Install through chat</text>
    <rect x="286" y="237" width="186" height="40" rx="20" fill="#1e3a5f"/>
    <text x="379" y="263" text-anchor="middle" fill="#bfdbfe">Collaborate wisely</text>
    <rect x="488" y="237" width="190" height="40" rx="20" fill="#312e66"/>
    <text x="583" y="263" text-anchor="middle" fill="#ddd6fe">Keep what matters</text>
  </g>
</svg>
