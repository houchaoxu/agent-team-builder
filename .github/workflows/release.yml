name: Stable release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install '.[test]'
      - name: Run complete test suite
        run: python -m pytest tests -q
      - name: Build and validate stable tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/build_release.py --tag "$RELEASE_TAG" --output-dir dist
      - name: Publish stable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$notes" \
              dist/agent-team-runtime-skill.zip dist/agent-team-runtime-skill.zip.sha256
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
              dist/agent-team-runtime-skill.zip dist/agent-team-runtime-skill.zip.sha256
          fi
