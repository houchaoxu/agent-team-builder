[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-team-runtime"
version = "2.5.0"
description = "Persistent, on-demand agent teams for coding assistants"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0,<7", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[project.scripts]
agent-team = "agent_team.cli:main"

[tool.setuptools.packages.find]
include = ["agent_team*"]
namespaces = false

[tool.setuptools.package-data]
agent_team = ["skill/SKILL.md", "skill/agents/*.yaml", "skill/references/*.md", "skill/scripts/*.py", "data/*.json", "data/*.txt"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/.DS_Store", ".DS_Store"]
